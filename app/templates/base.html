<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制样核查</title>
<style>
:root { --line:#d8dde3; --bg:#f5f7fa; --blue:#1f5fa8; --red:#b3261e; --green:#1e6b3a; --amber:#9a6700; }
* { box-sizing: border-box; }
body { margin:0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; background:var(--bg); color:#1d2530; }
header { background:#16324f; color:#fff; padding:14px 24px; }
header h1 { margin:0; font-size:20px; }
header .meta { font-size:12px; opacity:.85; margin-top:4px; }
main { max-width:1180px; margin:0 auto; padding:20px 24px 60px; }
section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:22px; }
h2 { font-size:16px; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line); }
table { border-collapse:collapse; width:100%; font-size:13px; }
th,td { border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top; }
th { background:#eef2f7; font-weight:600; }
code { background:#f0f2f5; padding:1px 5px; border-radius:4px; font-size:12px; }
.flash { padding:10px 14px; border-radius:6px; margin-bottom:12px; font-size:13px; }
.flash.ok { background:#e6f4ea; color:var(--green); border:1px solid #b7dfc3; }
.flash.error { background:#fcebea; color:var(--red); border:1px solid #f0bcb8; }
.badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; white-space:nowrap; }
.badge.same_powder { background:#e6f4ea; color:var(--green); }
.badge.independent { background:#e8f0fe; color:var(--blue); }
.badge.pending { background:#fff4e0; color:var(--amber); }
.badge.confirmed { background:#e6f4ea; color:var(--green); }
.badge.stale { background:#fcebea; color:var(--red); }
.badge.none { background:#eef0f3; color:#55606e; }
form.inline { display:inline; }
input[type=text], textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:5px; font-size:13px; font-family:inherit; }
button { padding:6px 14px; border:0; border-radius:5px; background:var(--blue); color:#fff; font-size:13px; cursor:pointer; }
button.ghost { background:#eef2f7; color:#1d2530; border:1px solid var(--line); }
button:disabled { opacity:.45; cursor:not-allowed; }
.muted { color:#6b7684; font-size:12px; }
.small { font-size:12px; }
details { margin-top:8px; }
summary { cursor:pointer; font-size:13px; color:var(--blue); }
.tag-cell { font-size:12px; line-height:1.7; }
.sticky-note { background:#fff8e6; border:1px solid #ecd9a0; padding:8px 12px; border-radius:6px; font-size:12px; margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1>岩芯制样核查台</h1>
  <div class="meta">
    数据集：{{ meta.dataset_id or '（未命名）' }} ｜
    数据版本：<strong>v{{ meta.data_version }}</strong>（更正来源后版本递增，旧页面确认将被拒绝）
  </div>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}

{% block content %}{% endblock %}
</main>
</body>
</html>
